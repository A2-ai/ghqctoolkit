openapi: 3.0.3
info:
  title: GHQC Toolkit API
  description: REST API for GitHub Quality Control workflow management
  version: 1.0.0

servers:
  - url: /api
    description: Default API path
  - url: /{prefix}/api
    description: API with custom prefix
    variables:
      prefix:
        default: ""
        description: Optional path prefix before /api

tags:
  - name: health
    description: Health check endpoints
  - name: milestones
    description: Milestone management
  - name: issues
    description: Issue management
  - name: comments
    description: Comments, approvals, and reviews
  - name: status
    description: Supporting data queries
  - name: configuration
    description: Configuration management
  - name: record
    description: PDF record generation
  - name: archive
    description: Archive generation
  - name: files
    description: File tree and content access
  - name: commits
    description: Commit history

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [health]
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /milestones:
    get:
      summary: List all milestones
      operationId: listMilestones
      tags: [milestones]
      responses:
        '200':
          description: List of milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Milestone'
    post:
      summary: Create a new milestone
      operationId: createMilestone
      tags: [milestones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMilestoneRequest'
      responses:
        '201':
          description: Milestone created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Milestone'

  /milestones/{number}/issues:
    get:
      summary: List issues in milestone
      operationId: listMilestoneIssues
      tags: [milestones]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
        '404':
          description: Milestone not found
    post:
      summary: Create QC issues in batch
      description: |
        Create multiple QC issues in a milestone with dependency resolution.
        Issues can reference each other within the batch, and creation order is
        automatically determined based on dependencies.
      operationId: createIssues
      tags: [issues]
      parameters:
        - name: number
          in: path
          required: true
          description: Milestone number to create issues in
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateIssueRequest'
              minItems: 1
      responses:
        '201':
          description: Issues created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreateIssueResponse'
        '400':
          description: |
            Invalid request. Possible reasons:
            - Unknown assignees
            - Circular dependencies detected
            - Duplicate files in batch
            - Self-references detected
        '404':
          description: Milestone not found

  /milestones/{number}/renames:
    get:
      summary: List detected file renames for open issues in a milestone
      description: |
        Checks open issues in the milestone against the current git HEAD tree and returns
        any files that have been renamed in a committed change. Used to prompt users to
        confirm renames via `POST /issues/{number}/rename`.
      operationId: listMilestoneRenames
      tags: [milestones]
      parameters:
        - name: number
          in: path
          required: true
          description: Milestone number
          schema:
            type: integer
      responses:
        '200':
          description: List of detected renames (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetectedRename'
        '404':
          description: Milestone not found

  /issues/status:
    get:
      summary: Batch get issue statuses
      description: Get detailed status for multiple issues at once.
      operationId: batchGetIssueStatus
      tags: [issues]
      parameters:
        - name: issues
          in: query
          required: true
          description: Comma-separated list of issue numbers
          schema:
            type: string
          example: "1,2,3"
      responses:
        '200':
          description: All issues resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchIssueStatusResponse'
        '206':
          description: Partial success — some issues resolved, some failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchIssueStatusResponse'
        '500':
          description: All issues failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchIssueStatusResponse'

  /issues/{number}:
    get:
      summary: Get issue details
      operationId: getIssue
      tags: [issues]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Issue details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '404':
          description: Issue not found

  /issues/{number}/comment:
    post:
      summary: Post a commit-to-commit comment
      operationId: createComment
      tags: [comments]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'

  /issues/{number}/approve:
    post:
      summary: Approve and close issue
      operationId: approveIssue
      tags: [comments]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
        - name: force
          in: query
          required: false
          description: Force approval even if blocking QCs are not approved
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '201':
          description: Issue approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '409':
          description: Blocking QCs not approved

  /issues/{number}/unapprove:
    post:
      summary: Unapprove and reopen issue
      operationId: unapproveIssue
      tags: [comments]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnapproveRequest'
      responses:
        '201':
          description: Issue unapproved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnapprovalResponse'

  /issues/{number}/rounds:
    post:
      summary: Start a new QC round
      description: |
        Writes the body's `## QC Rounds` marker, declares round N via an append-only
        `# QC Round N` comment (never by labels; the marker declares nothing), re-opens
        the issue, then posts the optional `# QC Notification` comparing the prior
        approval with the new round's start commit. Only permitted when the QC's status
        is `approved` or `changes_after_approval`.

        The marker write comes first and is a precondition: if it fails the round is not
        created (500), because a consumer may skip the comment fetch when the marker is
        absent and would then trust a stale `issue.branch`. Re-open and notification
        failures are non-fatal and reported on the response instead.
      operationId: createRound
      tags: [issues]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoundRequest'
      responses:
        '201':
          description: Round created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRoundResponse'
        '400':
          description: Empty checklist, or an unparseable start commit
        '409':
          description: The QC is not approved, so no round may be started
        '500':
          description: The `## QC Rounds` marker could not be written; the round was not created

  /issues/{number}/review:
    post:
      summary: Post working directory review
      operationId: reviewIssue
      tags: [comments]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Review posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'

  /preview/issue:
    post:
      summary: Preview issue body as HTML
      operationId: previewIssue
      tags: [issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '200':
          description: Rendered HTML body of the issue
          content:
            text/html:
              schema:
                type: string

  /preview/round:
    post:
      summary: Preview a `# QC Round N` comment as HTML
      description: |
        Renders the round comment through the same implementation `POST
        /issues/{number}/rounds` posts, so the preview cannot drift from what gets
        posted. This includes the `[file contents at initial qc commit](url)` line, whose
        URL is derived server-side from the repository's host and cannot be computed by a
        client. The round index is derived server-side too, exactly as round creation
        derives it.
      operationId: previewRound
      tags: [issues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRoundRequest'
      responses:
        '200':
          description: Rendered HTML body of the round comment
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Unparseable start commit

  /preview/previous-qc-diff:
    post:
      summary: Preview Previous QC diff comment as HTML
      operationId: previewPreviousQcDiff
      tags: [comments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviousQCDiffPreviewRequest'
      responses:
        '200':
          description: Rendered HTML body of the Previous QC diff comment
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Invalid current commit format
        '404':
          description: Previous QC issue or referenced file not found

  /preview/{number}/review:
    post:
      summary: Preview review comment body as HTML
      operationId: previewReview
      tags: [comments]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: Rendered HTML body of the review comment
          content:
            text/html:
              schema:
                type: string

  /preview/{number}/approve:
    post:
      summary: Preview approval comment body as HTML
      operationId: previewApprove
      tags: [comments]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: Rendered HTML body of the approval comment
          content:
            text/html:
              schema:
                type: string

  /preview/{number}/unapprove:
    post:
      summary: Preview unapproval comment body as HTML
      operationId: previewUnapprove
      tags: [comments]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnapproveRequest'
      responses:
        '200':
          description: Rendered HTML body of the unapproval comment
          content:
            text/html:
              schema:
                type: string

  /preview/{number}/comment:
    post:
      summary: Preview comment body as HTML
      operationId: previewComment
      tags: [comments]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '200':
          description: Rendered HTML body of the comment
          content:
            text/html:
              schema:
                type: string

  /issues/{number}/rename:
    post:
      summary: Confirm a detected file rename
      description: |
        Updates the issue title to `new_path`, appends a `## File History` entry to the
        issue body recording the old name, new name, and HEAD commit hash, and posts a
        timeline comment so the rename is visible in the issue thread.

        This is the confirmation step after `GET /milestones/{number}/renames` detects a rename.
      operationId: renameIssue
      tags: [issues]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameIssueRequest'
      responses:
        '204':
          description: Issue renamed successfully
        '400':
          description: new_path is empty or whitespace-only
        '404':
          description: Issue not found

  /issues/{number}/blocked:
    get:
      summary: Get issues blocked by this issue
      description: Returns a flat list of issues that depend on this issue (via gating_qc or previous_qc) along with their current status.
      operationId: getBlockedIssues
      tags: [issues]
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of blocked issues with status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockedIssueStatus'
        '404':
          description: Issue not found
        '501':
          description: Blocking dependencies API not available on this GitHub server

  /assignees:
    get:
      summary: List repository assignees
      operationId: listAssignees
      tags: [status]
      responses:
        '200':
          description: List of assignees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignee'

  /repo:
    get:
      summary: Get repository information
      operationId: getRepoInfo
      tags: [status]
      description: |
        Returns information about the current repository including local and remote commits.
        The remote_commit represents:
        - When Clean: Same as local_commit (repository is up to date)
        - When Ahead: The last common ancestor before local commits
        - When Behind/Diverged: The latest remote commit
      responses:
        '200':
          description: Repository information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoInfo'

  /commits:
    get:
      summary: List branch commits
      description: |
        Returns a paginated list of commits on the current branch (HEAD), newest first.
        If `file` is provided, each commit includes whether it touched that file.
        If `locate` is provided, returns the page containing that commit hash.
      operationId: listCommits
      tags: [commits]
      parameters:
        - name: file
          in: query
          required: false
          description: File path to check for changes per commit
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 0-indexed page number
          schema:
            type: integer
            default: 0
        - name: page_size
          in: query
          required: false
          description: Commits per page (1-50, default 10)
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
        - name: locate
          in: query
          required: false
          description: Commit hash prefix; if set, returns the page containing that commit
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of commits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCommitsResponse'

  /files/tree:
    get:
      summary: List directory entries
      description: Returns files and subdirectories at the given path in the repository.
      operationId: getFileTree
      tags: [files]
      parameters:
        - name: path
          in: query
          required: false
          description: Directory path relative to repository root (empty string for root)
          schema:
            type: string
            default: ""
      responses:
        '200':
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTreeResponse'

  /files/collaborators:
    get:
      summary: Get default collaborators for a file
      description: Returns collaborator metadata derived from the git author history for the given file.
      operationId: getFileCollaborators
      tags: [files]
      parameters:
        - name: path
          in: query
          required: true
          description: File path relative to repository root
          schema:
            type: string
      responses:
        '200':
          description: Default collaborator list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileCollaboratorsResponse'

  /files/content:
    get:
      summary: Get file content
      description: Returns the UTF-8 text content of a file at the given path, optionally resolved from a specific commit.
      operationId: getFileContent
      tags: [files]
      parameters:
        - name: path
          in: query
          required: true
          description: File path relative to repository root
          schema:
            type: string
        - name: commit
          in: query
          required: false
          description: Optional git commit hash to read from instead of the working tree
          schema:
            type: string
      responses:
        '200':
          description: File content
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid path, invalid commit, or file exists but is not valid UTF-8 text
        '404':
          description: File not found

  /files/raw:
    get:
      summary: Get raw file bytes for preview
      description: Returns the raw file bytes with an inline content type so the UI can embed previews such as PDFs, optionally resolved from a specific commit.
      operationId: getFileRaw
      tags: [files]
      parameters:
        - name: path
          in: query
          required: true
          description: File path relative to repository root
          schema:
            type: string
        - name: commit
          in: query
          required: false
          description: Optional git commit hash to read from instead of the working tree
          schema:
            type: string
      responses:
        '200':
          description: Raw file bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: File not found

  /archive/generate:
    post:
      summary: Generate a file archive
      description: |
        Builds a tar.gz archive containing each specified file at its given commit.
        When flatten is true, directory structure is stripped (files placed at root).
        A commit is never substituted: every file in `files` must carry a resolvable
        commit. A file the client cannot resolve a round for is omitted from `files` and
        declared in `skipped`; the server records those declarations verbatim in
        `ghqc_archive_metadata.json` so a partial archive says so itself, and echoes them
        in the response. Skipping is not falling back.
      operationId: generateArchive
      tags: [archive]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveGenerateRequest'
      responses:
        '200':
          description: Archive written successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveGenerateResponse'
        '400':
          description: Invalid request (empty output_path, invalid commit hash, etc.)
        '500':
          description: Archive generation failed

  /record/upload:
    post:
      summary: Upload a context PDF
      description: |
        Accepts a multipart/form-data request with a single `file` field containing a PDF.
        The file is saved to a server temp directory and its path is returned for use
        in subsequent preview/generate requests.
      operationId: uploadContextFile
      tags: [record]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file to upload (must have content-type application/pdf)
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordUploadResponse'
        '400':
          description: Missing file field or content-type is not application/pdf

  /record/preview:
    post:
      summary: Generate a record PDF preview
      description: |
        Runs the full record pipeline for the given milestones and returns a session key.
        The rendered PDF can be retrieved with `GET /record/preview.pdf?key=<key>`.
        Each call produces an independent key — concurrent sessions never share PDFs.
      operationId: previewRecord
      tags: [record]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRequest'
      responses:
        '200':
          description: Preview rendered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPreviewResponse'
        '400':
          description: No matching milestones found or invalid request
        '500':
          description: Record generation or render failed

  /record/preview.pdf:
    get:
      summary: Serve a previously generated preview PDF
      operationId: servePreviewPdf
      tags: [record]
      parameters:
        - name: key
          in: query
          required: true
          description: Preview key returned by POST /record/preview
          schema:
            type: string
      responses:
        '200':
          description: The rendered PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Key not found (expired or never created)

  /record/generate:
    post:
      summary: Generate and save a record PDF to disk
      description: |
        Runs the full record pipeline and writes the PDF to `output_path` on the server.
        The parent directory is created automatically if it does not exist.
      operationId: generateRecord
      tags: [record]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRequest'
      responses:
        '200':
          description: PDF written to output_path successfully
        '400':
          description: output_path is empty or request is invalid
        '500':
          description: Record generation or render failed

  /configuration:
    get:
      summary: Get configuration status and checklists
      operationId: getConfiguration
      tags: [configuration]
      responses:
        '200':
          description: Configuration status with full checklist content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationStatusResponse'
    post:
      summary: Clone and register a configuration repository
      operationId: setupConfiguration
      tags: [configuration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupConfigurationRequest'
      responses:
        '200':
          description: Configuration repository cloned and loaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationStatusResponse'
        '409':
          description: Configuration repository already set up
        '500':
          description: Clone or configuration load failed

  /configuration/update:
    post:
      summary: Fast-forward the configuration repository to match its remote
      description: >
        Fetches the configuration repository's remote and fast-forwards the local
        clone (`git pull --ff-only`). The update is refused, and the repository
        left untouched, when it has uncommitted changes, local commits not on the
        remote, or has diverged. On success the checklists are reloaded and the
        full configuration status is returned.
      operationId: updateConfiguration
      tags: [configuration]
      responses:
        '200':
          description: Configuration repository fast-forwarded (or already up to date) and reloaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationStatusResponse'
        '403':
          description: >
            Configuration updates are disabled for this deployment
            (`options.yaml` `allow_ui_config_update: false` or
            `GHQC_ALLOW_CONFIG_UPDATE=false`). No git work is attempted. The CLI
            `ghqc configuration update` is deliberately unaffected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Configuration updates are disabled for this deployment"
        '404':
          description: Configuration repository is not set up
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Configuration repository is not set up"
        '409':
          description: >
            Update refused because the repository is dirty, ahead of, or diverged
            from its remote. The `error` string is human-readable and actionable
            and may be displayed verbatim.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Cannot update: 2 local commit(s) not on the remote in /home/user/.local/share/ghqc/config. Push or reset them, then retry."
        '500':
          description: Fetch, pull, or configuration reload failed

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 1.0.0

    Milestone:
      type: object
      properties:
        number:
          type: integer
        title:
          type: string
        state:
          type: string
          enum: [open, closed]
        description:
          type: string
          nullable: true
        open_issues:
          type: integer
        closed_issues:
          type: integer

    CreateMilestoneRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    Issue:
      type: object
      properties:
        number:
          type: integer
        title:
          type: string
        state:
          type: string
          enum: [open, closed]
        html_url:
          type: string
        assignees:
          type: array
          items:
            type: string
        labels:
          type: array
          items:
            type: string
        milestone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          description: GitHub login of the user who created the issue
        branch:
          type: string
          nullable: true
          description: |
            Round 1's branch, parsed from the issue body. Retained for the cheap list
            paths, which return bare issues and never fold a thread. Valid only when
            `has_qc_rounds_marker` is false; when it is true this is round 1's branch and
            may be stale, and a consumer needing the current branch must read
            `rounds[last].branch` from the status endpoint.
        has_qc_rounds_marker:
          type: boolean
          description: |
            Whether the body carries a `## QC Rounds` section, i.e. whether rounds beyond
            round 1 exist. Presence only — the section's text is never authoritative and
            says nothing about how many rounds there are. A cheap path may read this to
            decide whether a comment fetch is required.
        relevant_files:
          type: array
          items:
            $ref: '#/components/schemas/RelevantFileInfo'

    RelevantFileInfo:
      type: object
      required: [file_name, kind]
      properties:
        file_name:
          type: string
        kind:
          $ref: '#/components/schemas/RelevantFileKind'
        issue_url:
          type: string
          nullable: true

    RelevantFileKind:
      type: string
      enum: [blocking_qc, relevant_qc, file]

    IssueStatusResponse:
      type: object
      description: |
        No top-level field duplicates a round-scoped value: `commits`, `branch` and
        `checklist_summary` were removed in favour of `rounds[]` and `drift`.
        Consumers read `rounds[rounds.length - 1]`.
      required: [issue, qc_status, dirty, rounds, drift, history, blocking_qc_status]
      properties:
        issue:
          $ref: '#/components/schemas/Issue'
        qc_status:
          $ref: '#/components/schemas/QCStatus'
        dirty:
          type: boolean
          description: Whether the file for this issue has uncommitted changes
        rounds:
          type: array
          description: Every QC round, oldest first. Never empty; `rounds[0]` comes from the issue body.
          minItems: 1
          items:
            $ref: '#/components/schemas/RoundInfo'
        drift:
          allOf:
            - $ref: '#/components/schemas/Gap'
          description: |
            The commits after the latest approval that no round has closed yet. Always
            present; empty and meaningless when
            `rounds[rounds.length - 1].state.kind != "approved"`.
        history:
          type: array
          description: |
            The History dropdown's rows in W6 order: pointers into `rounds[]`/`drift`,
            never copies of their commits. Carries two positional suppression rules the
            client must not rebuild (D30/U7) — round 1's preceding gap is skipped, and
            `drift` is emitted only when the latest round is closed. Never empty: a lone
            open round projects to exactly one `round` entry.
          minItems: 1
          items:
            $ref: '#/components/schemas/SegmentRef'
        blocking_qc_status:
          $ref: '#/components/schemas/BlockingQCStatus'

    RoundInfo:
      type: object
      required:
        - index
        - branch
        - branch_inherited
        - placement
        - start_commit
        - state
        - checklist_name
        - checklist_content
        - checklist_summary
        - commits
        - preceding_gap
        - archive_commit
        - subsequent_file_changes
      properties:
        index:
          type: integer
          description: |
            The **declared** round number: 1 for the issue body, otherwise the
            `# QC Round N` comment's ordinal. Never a re-indexed position, so it always
            agrees with the comment log — including when an earlier round could not be
            placed (D53).
        branch:
          type: string
          description: This round's branch; rounds may be on different branches
        branch_inherited:
          type: boolean
          description: |
            True when the round comment declared no `git branch:` and inherited this one
            from the previous round (D56). Branch scopes both the round's and its gap's
            commit walk, so surface this wherever the round is viewed.
        placement:
          type: string
          enum: [placed, unplaceable]
          description: |
            `unplaceable` (D53) means the declared start commit could not be resolved on
            `branch` — usually because it is not fetched locally. The round still exists
            and keeps its declared index, but `commits` and `preceding_gap` are empty and
            `archive_commit` is null. Render it with its index and a "fetch `branch`"
            state; never blank, never a substituted hash.
        start_commit:
          type: string
        state:
          $ref: '#/components/schemas/RoundState'
        checklist_name:
          type: string
          description: Empty string when the round carries no checklist
        checklist_content:
          type: string
          description: Excludes the `# ` heading line
        checklist_summary:
          $ref: '#/components/schemas/ChecklistSummary'
        commits:
          type: array
          items:
            $ref: '#/components/schemas/IssueCommit'
          description: This round's commits only, newest first
        preceding_gap:
          allOf:
            - $ref: '#/components/schemas/Gap'
          description: |
            Commits between the previous round's approval and this round's start,
            exclusive at both ends. Always empty for round 1.
        archive_commit:
          type: string
          nullable: true
          description: |
            The round's representative commit — the approval, else its newest
            status-bearing commit. **Null in exactly two cases** (D54): the round is
            `unplaceable`, or it is approved and its approval is no longer among the
            commits it owns (force-push/rebase). There is deliberately no substitute:
            archiving one would claim approved content over content that was never
            approved.
        subsequent_file_changes:
          type: boolean
          description: |
            Whether committed file changes exist after `archive_commit`.
            Conservatively true when any gap in the thread is divergent, and when
            `archive_commit` is null there is nothing to measure "after", so it is true.

    RoundState:
      description: |
        Tagged union, discriminated by `kind`, so an open round carrying an approval is
        not representable. `comment_id` deep-links the approval comment.
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [open]
        - type: object
          required: [kind, commit, comment_id]
          properties:
            kind:
              type: string
              enum: [approved]
            commit:
              type: string
            comment_id:
              type: integer
              format: int64
              nullable: true
              description: |
                Id of the comment that declared the approval, for the deep-link. Null when
                it is unknown (e.g. a comment cached before ids were recorded); never a
                `0` sentinel, which would be indistinguishable from a real id. Clients
                omit the deep-link when it is null.
        - type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [superseded]
      discriminator:
        propertyName: kind

    Gap:
      type: object
      description: |
        The commits between two anchors. One shape for both positions — a round's
        `preceding_gap` and the thread's `drift`; the field name carries the meaning.
      required: [commits, divergent, newest_file_change]
      properties:
        commits:
          type: array
          items:
            $ref: '#/components/schemas/IssueCommit'
          description: Newest first; an empty list is normal and meaningful
        divergent:
          type: boolean
          description: |
            The anchoring approval is not in this branch's ancestry (force-push,
            rebase, or a start commit not descended from the prior approval). Render
            as "no cohesive history" / "approval commit not in branch history".
        newest_file_change:
          type: string
          nullable: true
          description: |
            The newest file-changing commit in this gap. For `drift` this is the hash
            reported by the `changes_after_approval` status — the only source for it.

    SegmentKind:
      type: string
      description: |
        Which kind of segment a `SegmentRef` points at. `drift` is a distinct kind even
        though it is the same `Gap` type as a preceding gap: what a trailing gap *is*
        comes from its position, and the client selects the pinned tail block by kind
        rather than by index arithmetic.
      enum: [round, gap, drift]

    SegmentRef:
      type: object
      description: |
        One row of the History dropdown: a pointer into `rounds`/`drift`, never a copy
        of their commits.
      required: [kind, round_index]
      properties:
        kind:
          $ref: '#/components/schemas/SegmentKind'
        round_index:
          type: integer
          description: |
            The round this segment belongs to: itself for a `round`, the round it
            precedes for a `gap`, the latest round for `drift`. A *declared* index, so
            it is never a position in `history` or in `rounds`.

    QCStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - approved
            - changes_after_approval
            - awaiting_review
            - change_requested
            - in_progress
            - approval_required
            - changes_to_comment
          description: |
            - approved: Issue approved, no changes after
            - changes_after_approval: Approved but file changed since
            - awaiting_review: Latest commit notified but not reviewed
            - change_requested: Reviewed with changes requested
            - in_progress: Awaiting approval
            - approval_required: Closed without approval
            - changes_to_comment: File changes not yet commented on
        status_detail:
          type: string
          description: Human-readable status description

    GitStatus:
      type: object
      properties:
        status:
          type: string
          enum: [clean, ahead, behind, diverged]
          description: |
            - clean: Up to date with remote
            - ahead: Local commits not on remote
            - behind: Remote commits not local
            - diverged: Both ahead and behind
        detail:
          type: string
          description: Human-readable status description
        ahead_commits:
          type: array
          items:
            type: string
        behind_commits:
          type: array
          items:
            type: string

    IssueCommit:
      type: object
      properties:
        hash:
          type: string
        message:
          type: string
        statuses:
          type: array
          items:
            type: string
            enum: [initial, notification, approved, reviewed]
        file_changed:
          type: boolean

    ChecklistSummary:
      type: object
      properties:
        completed:
          type: integer
        total:
          type: integer
        percentage:
          type: number
          format: float

    BlockingQCStatus:
      type: object
      properties:
        total:
          type: integer
        approved_count:
          type: integer
        summary:
          type: string
          description: Formatted summary like "1/2 (50.0%)"
        approved:
          type: array
          items:
            $ref: '#/components/schemas/BlockingQCItem'
        not_approved:
          type: array
          items:
            $ref: '#/components/schemas/BlockingQCItemWithStatus'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BlockingQCError'

    BlockingQCItem:
      type: object
      properties:
        issue_number:
          type: integer
        file_name:
          type: string

    BlockingQCItemWithStatus:
      type: object
      properties:
        issue_number:
          type: integer
        file_name:
          type: string
        status:
          type: string

    BlockingQCError:
      type: object
      required: [issue_number, error, kind]
      properties:
        issue_number:
          type: integer
        error:
          type: string
        kind:
          $ref: '#/components/schemas/IssueStatusErrorKind'
        file_name:
          type: string
          description: >-
            Title of the QC'd file. Present for processing failures (incl.
            `branch_not_local`) since the issue was fetched; absent for
            `fetch_failed` errors where the issue body was never retrieved.
        branch:
          type: string
          description: >-
            The branch ref the user needs to fetch / track locally. Set when
            `kind == branch_not_local`; absent otherwise.

    IssueStatusErrorKind:
      type: string
      description: >-
        - `fetch_failed`: the issue itself could not be fetched from GitHub.
        - `processing_failed`: the issue was fetched but its thread/cache could not be built.
        - `branch_not_local`: the issue's branch ref isn't checked out locally; the response
          includes a `branch` field naming it. Also returned (D55) when the **latest**
          round's commit cannot be resolved — an unplaceable round, or an approval no
          longer on its branch — because a status derived from a substituted commit would
          be a confident wrong answer. An *earlier* unplaceable round never blocks status.
      enum: [fetch_failed, processing_failed, branch_not_local]

    IssueStatusError:
      type: object
      required: [issue_number, kind, error]
      properties:
        issue_number:
          type: integer
        kind:
          $ref: '#/components/schemas/IssueStatusErrorKind'
        error:
          type: string
        branch:
          type: string
          description: >-
            The branch ref the user needs to fetch / track locally. Set when
            `kind == branch_not_local`; absent otherwise.

    BatchIssueStatusResponse:
      type: object
      required: [results, errors]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/IssueStatusResponse'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/IssueStatusError'

    CreateIssueRequest:
      type: object
      required: [file, checklist_name, checklist_content]
      properties:
        file:
          type: string
          description: Path to the file being QC'd
          example: "src/analysis/results.R"
        checklist_name:
          type: string
          description: Name of the checklist to use
          example: "Code Review"
        checklist_content:
          type: string
          description: Markdown checklist content with checkboxes
          example: "- [ ] Code compiles\n- [ ] Tests pass"
        assignees:
          type: array
          description: GitHub usernames to assign to the issue
          items:
            type: string
          example: ["reviewer1", "reviewer2"]
        collaborators:
          type: array
          nullable: true
          description: Optional collaborator metadata entries in `Name <email>` format. When omitted, the server derives defaults from git history.
          items:
            type: string
          example: ["Jane Doe <jane@example.com>", "John Smith <john@example.com>"]
        previous_qc:
          type: array
          description: Previous QC issues that must be approved before this one
          items:
            $ref: '#/components/schemas/RelevantIssue'
        gating_qc:
          type: array
          description: Gating QC issues that must be approved before this one
          items:
            $ref: '#/components/schemas/RelevantIssue'
        relevant_qc:
          type: array
          description: Related QC issues (informational, don't block approval)
          items:
            $ref: '#/components/schemas/RelevantIssue'
        relevant_files:
          type: array
          description: Files without QC issues (requires justification)
          items:
            $ref: '#/components/schemas/RelevantFileInput'

    RelevantIssue:
      type: object
      required: [file_name, issue_class]
      properties:
        file_name:
          type: string
          description: Path to the related file
          example: "src/utils/helpers.R"
        issue_class:
          $ref: '#/components/schemas/RelevantIssueClass'
        description:
          type: string
          nullable: true
          description: Optional description of the relationship
          example: "Depends on helper functions"
        include_diff:
          type: boolean
          default: true
          description: >
            Whether to post a diff comment for this Previous QC entry.
            Only applicable for previous_qc entries; ignored for gating_qc and relevant_qc.

    RelevantIssueClass:
      oneOf:
        - type: object
          title: ExistingIssue
          description: Reference to an already-created issue
          required: [Exists]
          properties:
            Exists:
              type: object
              required: [issue_number]
              properties:
                issue_number:
                  type: integer
                  description: Issue number of the existing issue
                  example: 42
                issue_id:
                  type: integer
                  nullable: true
                  description: Optional GitHub issue ID (node ID numeric part)
                  example: 123456789
        - type: object
          title: NewIssue
          description: Reference to an issue being created in this batch
          required: [New]
          properties:
            New:
              type: string
              description: File path matching another file in this batch
              example: "src/utils/helpers.R"
      example:
        Exists:
          issue_number: 42
          issue_id: 123456789

    RelevantFileInput:
      type: object
      required: [file_path, justification]
      properties:
        file_path:
          type: string
        justification:
          type: string

    CreateIssueResponse:
      type: object
      properties:
        issue_url:
          type: string
        issue_number:
          type: integer
        blocking_created:
          type: array
          items:
            type: integer
        blocking_errors:
          type: array
          items:
            $ref: '#/components/schemas/BlockingQCError'

    CreateCommentRequest:
      type: object
      required: [current_commit]
      properties:
        current_commit:
          type: string
        previous_commit:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        include_diff:
          type: boolean
          default: true

    CommentResponse:
      type: object
      properties:
        comment_url:
          type: string

    ReviewResponse:
      type: object
      properties:
        comment_url:
          type: string
        stash:
          $ref: '#/components/schemas/ReviewStashResult'

    ApproveRequest:
      type: object
      required: [commit]
      properties:
        commit:
          type: string
        note:
          type: string
          nullable: true

    ApprovalResponse:
      type: object
      properties:
        approval_url:
          type: string
        skipped_unapproved:
          type: array
          items:
            type: integer
        skipped_errors:
          type: array
          items:
            $ref: '#/components/schemas/BlockingQCError'
        closed:
          type: boolean
          description: "Whether the issue was successfully closed"

    CreateRoundRequest:
      type: object
      required: [start_commit, branch, checklist]
      description: |
        `start_commit` and `branch` both come from the caller's checkout, read-only —
        there is no commit picker in the round flow.
      properties:
        start_commit:
          type: string
          description: Full commit hash the new round starts at
        branch:
          type: string
          description: The new round's branch
        checklist:
          type: object
          required: [name, content]
          description: Must contain at least one checklist item
          properties:
            name:
              type: string
            content:
              type: string
              description: Excludes the `# ` heading line
        notify:
          type: boolean
          default: true
          description: |
            Post a `# QC Notification` comparing the prior approval with the new start
            commit. Defaults to **true** (D57), matching `ghqc issue round create`'s
            `--no-notify` opt-out; omitting the field opts in.
        note:
          type: string
          nullable: true
        include_diff:
          type: boolean
          default: true

    PreviewRoundRequest:
      type: object
      required: [issue_number, start_commit, branch, checklist]
      description: |
        The round-comment half of `CreateRoundRequest`. No round index: the server derives
        it exactly as round creation does, so the preview cannot claim a round number the
        creation would not use.
      properties:
        issue_number:
          type: integer
          description: The QC issue the round would be added to
        start_commit:
          type: string
          description: Full commit hash the new round starts at
        branch:
          type: string
          description: The new round's branch
        checklist:
          type: object
          required: [name, content]
          properties:
            name:
              type: string
            content:
              type: string
              description: Excludes the `# ` heading line

    CreateRoundResponse:
      type: object
      required: [round_index, comment_url, reopened, notification]
      properties:
        round_index:
          type: integer
          description: 1-based index of the round just created
        comment_url:
          type: string
        reopened:
          type: boolean
          description: |
            Whether re-opening the issue succeeded. Non-fatal — the round comment is
            already posted — but reported: a failed re-open leaves the issue closed with
            an unapproved latest round, which the status endpoint reports as
            `approval_required` for a round that was just created.
        notification:
          $ref: '#/components/schemas/NotificationOutcome'

    NotificationOutcome:
      description: |
        Outcome of the optional `# QC Notification` comment, discriminated by `kind` so
        "not requested" and "requested but failed" are distinguishable — a client can
        offer to post it manually. Failure is non-fatal: the round exists either way.
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [not_requested]
        - type: object
          required: [kind, url]
          properties:
            kind:
              type: string
              enum: [posted]
            url:
              type: string
        - type: object
          required: [kind, error]
          properties:
            kind:
              type: string
              enum: [failed]
            error:
              type: string
      discriminator:
        propertyName: kind

    UnapproveRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    UnapprovalResponse:
      type: object
      properties:
        unapproval_url:
          type: string
        opened:
          type: boolean
          description: "Whether the issue was successfully re-opened"
    BlockedIssueStatus:
      type: object
      required: [issue, qc_status]
      properties:
        issue:
          $ref: '#/components/schemas/Issue'
        qc_status:
          $ref: '#/components/schemas/QCStatus'

    ReviewRequest:
      type: object
      required: [commit]
      properties:
        commit:
          type: string
        note:
          type: string
          nullable: true
        include_diff:
          type: boolean
          default: true
        auto_stash:
          type: boolean
          default: true

    PreviousQCDiffPreviewRequest:
      type: object
      required: [current_file, previous_file, previous_issue_number, current_commit]
      properties:
        current_file:
          type: string
          description: The file for the QC currently being created
        previous_file:
          type: string
          description: The file referenced as Previous QC
        previous_issue_number:
          type: integer
          description: Existing Previous QC issue number
        current_commit:
          type: string
          description: Current repo commit used as the new QC initial commit

    ReviewStashResult:
      type: object
      properties:
        status:
          type: string
          enum: [stashed, no_changes, skipped, failed]
        message:
          type: string
          nullable: true

    Assignee:
      type: object
      properties:
        login:
          type: string
        name:
          type: string
          nullable: true

    RepoInfo:
      type: object
      required:
        - owner
        - repo
        - remote
        - branch
        - local_commit
        - remote_commit
        - git_status
        - git_status_detail
        - dirty_files
      properties:
        owner:
          type: string
          description: Repository owner/organization
        repo:
          type: string
          description: Repository name
        remote:
          type: string
          description: >-
            Name of the user's default remote (typically "origin", but
            configurable via `git clone --origin <name>` or rename).
          example: origin
        branch:
          type: string
          description: Current branch name
        local_commit:
          type: string
          description: Current local commit hash
        remote_commit:
          type: string
          description: Remote tracking commit hash (base ancestor when ahead, latest remote when behind)
        git_status:
          $ref: '#/components/schemas/GitStatusEnum'
        git_status_detail:
          type: string
          description: Human-readable git status description
        dirty_files:
          type: array
          items:
            type: string
          description: List of files which have non-committed changes
        current_user:
          type: string
          nullable: true
          description: GitHub login of the authenticated user, if available


    Checklist:
      type: object
      properties:
        name:
          type: string
        content:
          type: string

    ConfigurationStatusResponse:
      type: object
      properties:
        directory:
          type: string
        exists:
          type: boolean
        git_repository:
          $ref: '#/components/schemas/ConfigGitRepository'
        options:
          $ref: '#/components/schemas/ConfigurationOptions'
        checklists:
          type: array
          items:
            $ref: '#/components/schemas/Checklist'
        config_repo_env:
          type: string
          nullable: true
          description: Value of GHQC_CONFIG_REPO env var, if set

    ConfigGitRepository:
      type: object
      nullable: true
      properties:
        owner:
          type: string
          example: a2-ai
        repo:
          type: string
          example: ghqc.example_config_repo
        status:
          type: string
          enum: [clean, ahead, behind, diverged]
          example: behind
        status_detail:
          type: string
          description: Human-readable summary of `status`
          example: Repository is behind by 3 commits
        ahead_commits:
          type: array
          description: Full shas of local commits not present on the remote. Empty unless status is ahead or diverged.
          items:
            type: string
          example: []
        behind_commits:
          type: array
          description: Full shas of remote commits not present locally. Empty unless status is behind or diverged.
          items:
            type: string
          example:
            - 8f2a1c9d4b6e0f3a7c5d2b8e1a4f6c9d0b3e5a72
            - 1b4e7a0c3f6d9b2e5a8c1f4d7b0e3a6c9d2f5b81
            - 5d8b1e4a7c0f3d6b9e2a5c8f1b4d7a0e3c6f9b24
        dirty_files:
          type: array
          description: Repo-relative paths with uncommitted (staged or unstaged) changes
          items:
            type: string
          example: []

    SetupConfigurationRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Git URL of the configuration repository to clone
          example: "https://github.com/owner/config-repo"

    ConfigurationOptions:
      type: object
      properties:
        prepended_checklist_note:
          type: string
          nullable: true
        checklist_display_name:
          type: string
        include_collaborators:
          type: boolean
          description: Whether collaborator metadata should be detected, editable, and included in issue creation flows
          default: true
        logo_path:
          type: string
        logo_found:
          type: boolean
        checklist_directory:
          type: string
        record_path:
          type: string
        ui_repo_refresh_rate_seconds:
          type: integer
          format: int64
          minimum: 1
          description: Effective UI repository refresh interval in seconds after config, env, and default fallback
          example: 15
        allow_config_update:
          type: boolean
          description: >
            Whether the Web UI may fast-forward the configuration repository, resolved from
            `options.yaml` `allow_ui_config_update`, then `GHQC_ALLOW_CONFIG_UPDATE`, then the
            default `true`. When false the Update button is not offered and
            POST /configuration/update returns 403.
          example: true

    RecordContextFileRequest:
      type: object
      required: [server_path, position]
      properties:
        server_path:
          type: string
          description: Absolute path on the server (use the temp_path from POST /record/upload for locally uploaded files)
          example: "/tmp/ghqc-uploads/abc123.pdf"
        position:
          type: string
          enum: [prepend, append]
          description: Whether to insert this PDF before or after the QC Record in the output

    RecordRequest:
      type: object
      required: [milestone_numbers]
      properties:
        milestone_numbers:
          type: array
          items:
            type: integer
          description: GitHub milestone numbers to include in the record
          example: [1, 2]
        tables_only:
          type: boolean
          default: false
          description: When true, only emit summary tables without full issue details
        output_path:
          type: string
          description: Destination path for the generated PDF (required for generate, ignored for preview)
          example: "/path/to/output/record.pdf"
        context_files:
          type: array
          items:
            $ref: '#/components/schemas/RecordContextFileRequest'
          description: Optional PDF files to merge before/after the QC Record

    RecordUploadResponse:
      type: object
      required: [temp_path]
      properties:
        temp_path:
          type: string
          description: Absolute server path where the uploaded PDF was saved
          example: "/tmp/ghqc-uploads/abc123def456.pdf"

    RecordPreviewResponse:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Opaque session key — pass to GET /record/preview.pdf?key=<key> to retrieve the PDF
          example: "a1b2c3d4e5f6"

    GitStatusEnum:
      type: string
      enum: [clean, dirty, ahead, behind, diverged, conflict]
      description: |
        - clean: Up to date with remote, no uncommitted changes
        - dirty: Has uncommitted changes
        - ahead: Local commits not on remote
        - behind: Remote commits not local
        - diverged: Both ahead and behind
        - conflict: Merge conflicts present

    PagedCommitsResponse:
      type: object
      required: [commits, total, page, page_size]
      properties:
        commits:
          type: array
          items:
            $ref: '#/components/schemas/BranchCommit'
        total:
          type: integer
          description: Total number of commits
        page:
          type: integer
          description: Current 0-indexed page number
        page_size:
          type: integer
          description: Number of commits per page

    BranchCommit:
      type: object
      required: [hash, message, file_changed]
      properties:
        hash:
          type: string
          description: Full commit hash
        message:
          type: string
          description: Commit message
        file_changed:
          type: boolean
          description: Whether this commit changed the requested file (false if no file filter)

    FileTreeResponse:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
          description: Directory path that was queried
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FileTreeEntry'

    FileTreeEntry:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          description: File or directory name
        kind:
          type: string
          enum: [file, directory]

    FileCollaboratorsResponse:
      type: object
      required: [path, collaborators]
      properties:
        path:
          type: string
          description: File path that was queried
        author:
          type: string
          nullable: true
          description: Resolved issue author for the selected file. This entry is fixed metadata and not a removable collaborator.
        collaborators:
          type: array
          description: Default collaborator metadata entries derived from git author history
          items:
            type: string

    ArchiveGenerateRequest:
      type: object
      required: [output_path, flatten, files]
      properties:
        output_path:
          type: string
          description: Destination path for the archive file
          example: "repo-milestone.tar.gz"
        flatten:
          type: boolean
          description: When true, strip directory structure and place all files at root
        files:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveFileRequest'
          minItems: 1
        skipped:
          type: array
          default: []
          description: |
            Files the client is deliberately omitting from the archive, and why. Recorded
            verbatim in the archive manifest's `skipped` array. Optional — omit it (or
            send `[]`) for a complete archive, whose manifest then carries no `skipped`
            key at all.
          items:
            $ref: '#/components/schemas/SkippedFileRequest'

    ArchiveFileRequest:
      type: object
      required: [repository_file, commit]
      description: |
        One file to archive. The QC metadata quartet — `milestone`, `approved`, `round`,
        and `subsequent_file_changes` — is all-or-nothing: either all four are present
        (the file is archived with QC metadata) or all four are absent (archived as a
        plain file). Any partial combination is rejected with `400`.
        There is deliberately no default for the missing fields: only the client knows
        which round it selected, and inventing one would freeze a stale claim into an
        audit snapshot.
      properties:
        repository_file:
          type: string
          description: Path to the file in the repository
          example: "src/analysis.R"
        commit:
          type: string
          description: Full commit hash to retrieve the file at
        milestone:
          type: string
          nullable: true
          description: Milestone name (for QC metadata in archive)
        approved:
          type: boolean
          nullable: true
          description: Whether the file's QC issue is approved
        round:
          type: integer
          nullable: true
          description: The round the selected commit belongs to
        subsequent_file_changes:
          type: boolean
          nullable: true
          description: Whether committed file changes exist after the selected commit

    SkippedFileRequest:
      type: object
      required: [repository_file, round, branch, reason]
      description: |
        One file the client declares it is omitting from the archive. This endpoint takes
        an explicit `commit` per file and no issue number, so the server cannot resolve a
        round here — the skip decision belongs to the client and the server records it.
      properties:
        repository_file:
          type: string
          description: Path to the omitted file in the repository
          example: "src/other.R"
        round:
          type: integer
          description: The 1-based round that was selected but could not be resolved
          example: 3
        branch:
          type: string
          description: The branch the unresolvable round declared
          example: "feature/x"
        reason:
          type: string
          description: Human-readable explanation recorded in the manifest
          example: "start commit could not be placed on 'feature/x'"

    SkippedFileResponse:
      allOf:
        - $ref: '#/components/schemas/SkippedFileRequest'
      description: |
        One skip as recorded in the archive manifest. Identical in shape to
        `SkippedFileRequest`: the server records the client's declaration verbatim.

    ArchiveGenerateResponse:
      type: object
      required: [output_path, skipped]
      properties:
        output_path:
          type: string
          description: Absolute path where the archive was written
          example: "/path/to/repo-milestone.tar.gz"
        skipped:
          type: array
          description: |
            The skips recorded in the archive manifest, echoed back so a client can
            confirm its declaration was written. Empty for a complete archive.
          items:
            $ref: '#/components/schemas/SkippedFileResponse'

    DetectedRename:
      type: object
      required: [issue_number, old_path, new_path]
      description: A file rename detected for an open QC issue
      properties:
        issue_number:
          type: integer
          description: The issue whose title (file path) was renamed
        old_path:
          type: string
          description: The old file path (current issue title)
          example: "scripts/file_b.R"
        new_path:
          type: string
          description: The new file path detected in git history
          example: "scripts/file_b_renamed.R"

    RenameIssueRequest:
      type: object
      required: [new_path]
      description: Request body for confirming a file rename
      properties:
        new_path:
          type: string
          description: The new file path to rename the issue title to
          example: "scripts/file_b_renamed.R"

    FileRenameEvent:
      type: object
      required: [old_path, new_path, commit]
      description: A single rename entry recorded in an issue's File History section
      properties:
        old_path:
          type: string
          description: The file path before the rename
          example: "scripts/file_b.R"
        new_path:
          type: string
          description: The file path after the rename
          example: "scripts/file_b_renamed.R"
        commit:
          type: string
          description: The HEAD commit hash at the time the rename was confirmed
          example: "abc1234"
