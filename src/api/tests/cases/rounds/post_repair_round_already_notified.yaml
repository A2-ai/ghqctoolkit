name: "POST /api/issues/{number}/rounds/repair - an already-notified round is never notified twice"
description: "Round 2 carries a QC Notification, so a repair that asks for one still posts nothing: the round is in the state it should be"

fixtures:
  issues:
    - type: mock
      number: 1
      title: "src/test.rs"
      # Open, with a correct marker: nothing at all is incomplete.
      state: "open"
      body: |
        Quality check issue for src/test.rs

        ## Metadata
        initial qc commit: 456def789abc012345678901234567890123cdef
        git branch: main
        author: The Octocat <octocat@example.com>

        ## QC Round
        * current round: 2
        * round comment: https://github.com/test-owner/test-repo/issues/1#issuecomment-456

        # Code Review Checklist
        - [ ] Reviewed the logic
      milestone: 1
  comments:
    - issue: 1
      author: reviewer
      body: |
        # QC Approval

        ## Metadata
        approved qc commit: 456def789abc012345678901234567890123cdef
    - issue: 1
      author: author
      id: 456
      html_url: "https://github.com/test-owner/test-repo/issues/1#issuecomment-456"
      body: |
        # QC Round

        ## Metadata
        * round: 2
        * initial qc round commit: abc1234567890abcdef1234567890abcdef12340
        * previous approved commit: 456def789abc012345678901234567890123cdef
        * git branch: main

        # Code Review Checklist
        - [ ] Reviewed the logic
    # `current commit: ` is the key the fold reads and the key `QCComment` writes. Spelled
    # any other way this comment carries no notification event and the round would read
    # un-notified, so a requested notification would be posted a second time.
    - issue: 1
      author: author
      body: |
        # QC Notification

        ## Metadata
        current commit: abc1234567890abcdef1234567890abcdef12340

git_state:
  branch_tip: "abc1234567890abcdef1234567890abcdef12340"
  commits:
    - "abc1234567890abcdef1234567890abcdef12340"
    - "456def789abc012345678901234567890123cdef"

request:
  method: POST
  path: "/api/issues/1/rounds/repair"
  # Asked for, and still not posted: the round already has one.
  body:
    notification: "full"

response:
  status: 200
  body:
    match_type: partial
    fields:
      round: 2
      reopened:
        status: "skipped"
      body_marker:
        status: "skipped"
      # Skipped for the honest reason — the notification exists — so no reason is
      # reported: `skipped_reason` names a step that *could not* be attempted.
      notification:
        status: "skipped"
      repaired: false
      needs_repair: false

# Nothing was written: a repair never double-posts.
assert_write_calls: []
