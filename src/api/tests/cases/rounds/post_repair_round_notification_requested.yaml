name: "POST /api/issues/{number}/rounds/repair - notification on request only"
description: "Round 2 has no QC Notification; the repair posts one only because the request asked for it"

fixtures:
  issues:
    - type: mock
      number: 1
      title: "src/test.rs"
      # Open, with a correct marker: the notification is the only thing missing.
      state: "open"
      body: |
        Quality check issue for src/test.rs

        ## Metadata
        initial qc commit: 456def789abc012345678901234567890123cdef
        git branch: main
        author: The Octocat <octocat@example.com>

        ## QC Round
        * current round: 2
        * round comment: https://github.com/test-owner/test-repo/issues/1#issuecomment-456

        # Code Review Checklist
        - [ ] Reviewed the logic
      milestone: 1
  comments:
    - issue: 1
      author: reviewer
      body: |
        # QC Approval

        ## Metadata
        approved qc commit: 456def789abc012345678901234567890123cdef
    - issue: 1
      author: author
      id: 456
      html_url: "https://github.com/test-owner/test-repo/issues/1#issuecomment-456"
      body: |
        # QC New Round

        ## Metadata
        * round: 2
        * round commit: abc1234567890abcdef1234567890abcdef12340
        * previous approved commit: 456def789abc012345678901234567890123cdef
        * checklist: Code Review Checklist
        * note: Second pass after the refactor.

        ## Checklist
        - [ ] Reviewed the logic

git_state:
  branch_tip: "abc1234567890abcdef1234567890abcdef12340"

request:
  method: POST
  path: "/api/issues/1/rounds/repair"
  body:
    notification: "metadata_only"

response:
  status: 200
  body:
    match_type: partial
    fields:
      round: 2
      reopened:
        status: "skipped"
      body_marker:
        status: "skipped"
      notification:
        status: "done"
      repaired: true
      needs_repair: false

# The notification is the only write.
assert_write_calls:
  - type: PostComment
    comment_type: "ghqctoolkit::comment::QCComment"
    position: 0
  - type: PostComment
    comment_type: "ghqctoolkit::comment::QCComment"
    position: last
