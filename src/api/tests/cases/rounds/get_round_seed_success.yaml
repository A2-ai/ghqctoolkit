name: "GET /api/issues/{number}/rounds/seed - seed from the issue body"
description: "Seeds the next round's checklist from Initial QC's checklist, boxes reset"

fixtures:
  issues:
    - type: mock
      number: 1
      title: "src/test.rs"
      body: |
        Quality check issue for src/test.rs

        ## Metadata
        initial qc commit: 456def789abc012345678901234567890123cdef
        git branch: main
        author: The Octocat <octocat@example.com>

        # Code Review Checklist
        - [x] Reviewed the logic
        - [ ] Checked the tests
      milestone: 1
  comments:
    - issue: 1
      author: reviewer
      body: |
        # QC Approval

        ## Metadata
        approved qc commit: 456def789abc012345678901234567890123cdef

git_state:
  branch_tip: "abc1234567890abcdef1234567890abcdef12340"

request:
  method: GET
  path: "/api/issues/1/rounds/seed"

response:
  status: 200
  body:
    match_type: exact
    value:
      file: "src/test.rs"
      next_round: 2
      next_round_name: "Round 2"
      checklist_content: "- [ ] Reviewed the logic\n- [ ] Checked the tests"
      checklist_name: "Code Review Checklist"
      # Only Initial QC exists, so it is the only choice and the default.
      checklist_options:
        - round: 1
          round_name: "Initial QC"
          checklist_name: "Code Review Checklist"
          content: "- [ ] Reviewed the logic\n- [ ] Checked the tests"
      default_round: 1
      anchor: "abc1234567890abcdef1234567890abcdef12340"
      branch: main
      comparison_base: "456def789abc012345678901234567890123cdef"
      divergence: null
      previous_approval: "456def789abc012345678901234567890123cdef"
      can_start: true
      blocked_reason: null

# A seed must never write.
assert_write_calls: []
